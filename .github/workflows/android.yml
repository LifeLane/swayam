name: Android CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --no-daemon
          else
            gradle testDebugUnitTest --no-daemon
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Setup Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            if [ -s "app/release.keystore" ]; then
              echo "has_keystore=true" >> $GITHUB_OUTPUT
              echo "Keystore decoded successfully."
            else
              echo "has_keystore=false" >> $GITHUB_OUTPUT
              echo "Keystore is empty."
            fi
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No signing keystore secret provided. Building unsigned release artifacts."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HAS_KEYSTORE: ${{ steps.keystore.outputs.has_keystore }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ -f "app/release.keystore" ]; then
            if [ -f "./gradlew" ]; then
              ./gradlew assembleRelease --no-daemon \
                -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
                -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
                -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
                -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            else
              gradle assembleRelease --no-daemon \
                -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
                -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
                -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
                -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            fi
          else
            if [ -f "./gradlew" ]; then
              ./gradlew assembleRelease --no-daemon
            else
              gradle assembleRelease --no-daemon
            fi
          fi

      - name: Build Release AAB (Google Play App Bundle)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HAS_KEYSTORE: ${{ steps.keystore.outputs.has_keystore }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ -f "app/release.keystore" ]; then
            if [ -f "./gradlew" ]; then
              ./gradlew bundleRelease --no-daemon \
                -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
                -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
                -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
                -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            else
              gradle bundleRelease --no-daemon \
                -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
                -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
                -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
                -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            fi
          else
            if [ -f "./gradlew" ]; then
              ./gradlew bundleRelease --no-daemon
            else
              gradle bundleRelease --no-daemon
            fi
          fi

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swayam-builds
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Create GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
